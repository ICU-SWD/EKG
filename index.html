<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Patient Monitor Simulation</title>
    <style>
        /* ตั้งค่า Theme มอนิเตอร์โรงพยาบาล */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }

        /* โซนที่ 1: Vital Signs (ด้านบน) */
        .top-panel {
            display: flex;
            justify-content: space-between;
            background-color: #111;
            padding: 15px 30px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 10px;
        }
        .vital-sign { text-align: center; }
        .vital-label { font-size: 14px; color: #888; text-transform: uppercase; }
        .hr-value { font-size: 40px; color: #00ff00; font-weight: bold; } /* สีเขียว ECG */
        .bp-value { font-size: 40px; color: #ff3333; font-weight: bold; } /* สีแดง BP */
        .spo2-value { font-size: 40px; color: #00ccff; font-weight: bold; } /* สีฟ้า SpO2 */

        /* โซนที่ 2: กราฟ ECG (ตรงกลาง) */
        .main-display {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            border-radius: 8px;
            border: 1px solid #333;
        }
        canvas {
            width: 100%;
            max-height: 400px;
        }

        /* โซนที่ 3: แผงควบคุม (ด้านล่าง) */
        .control-panel {
            margin-top: 10px;
            padding: 15px;
            background-color: #222;
            border-radius: 8px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #666; }
        .btn-shock { background-color: #ff9900; color: black; }
        .btn-cpr { background-color: #cc0000; }
    </style>
</head>
<body>

    <!-- Top Panel: แสดงค่า Vital Signs -->
    <div class="top-panel">
        <div class="vital-sign">
            <div class="vital-label">HR / ECG II</div>
            <div class="hr-value" id="displayHR">80</div>
        </div>
        <div class="vital-sign">
            <div class="vital-label">NIBP (mmHg)</div>
            <div class="bp-value" id="displayBP">120/80</div>
        </div>
        <div class="vital-sign">
            <div class="vital-label">SpO2 (%)</div>
            <div class="spo2-value" id="displaySpO2">98</div>
        </div>
    </div>

    <!-- Main Display: วาดกราฟ -->
    <div class="main-display">
        <canvas id="ecgMonitor" width="1000" height="300"></canvas>
    </div>

    <!-- Control Panel: ปุ่มจำลองต่างๆ -->
    <div class="control-panel">
        <button onclick="alert('กำลังพัฒนาระบบจ่ายยา')">💊 ยา (Medications)</button>
        <button class="btn-shock" onclick="alert('กำลังพัฒนาระบบ Defibrillate')">⚡ Shock (Defib)</button>
        <button class="btn-cpr" onclick="alert('เริ่มจับเวลา 2 นาที')">⏱️ Start CPR</button>
        <button onclick="alert('แสดงหน้าต่างโจทย์ ACS')">📋 โหมดทดสอบ (Exam)</button>
    </div>

    <script>
        // โค้ด JavaScript สำหรับวาด Canvas ของเก่าจะถูกนำมาใส่ตรงนี้ 
        // หรือจะแยกไปไว้ใน GitHub แล้วดึงมาใส่ทีหลัง
    </script>
</body>
</html>
